name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the studio with `npm run dev`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Provider mode
      options:
        - mock
        - live
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `node --version` and the first line of `ffmpeg -version`.
  - type: textarea
    id: logs
    attributes:
      label: Job log or server output
      description: Remove API keys and anything private before pasting.
      render: text
